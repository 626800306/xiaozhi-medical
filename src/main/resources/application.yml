server:
  port: 8080
# langchain4j配置
langchain4j:
  # open-ai
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: sk-35e9f42c26054acc986f5f3760e7bcdd
      model-name: deepseek-flash
      log-requests: true
      log-responses: true
  # ollama
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: deepseek-r1:1.5b
      timeout: PT60S
  # dashscope
#  community:
#    dashscope:
#      chat-model:
#        base-url: https://llm-avizckv7lcdbivnw.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
#        api-key: sk-d76bf72023934153af92e3bb92a71f09
#        model-name: qwen-max

# qwen
# 启用日志级别
logging:
  level:
    root: info
# knife4j配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: org.atguigu # 与你的项目包名保持一致
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  # 生产环境可设为 true 关闭文档；本地开发保持 false 即可访问
  production: false
  # 若开启 basic-auth 会要求登录，本地调试先关闭
  basic-auth:
    enable: false
  setting:
    language: zh_cn
